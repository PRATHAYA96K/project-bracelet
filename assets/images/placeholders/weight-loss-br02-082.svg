<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgForest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130F"/>
      <stop offset="45%" stop-color="#0E231B"/>
      <stop offset="100%" stop-color="#07120E"/>
    </linearGradient>
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#265C45" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#143427" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07130F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldAura" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="celestialGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#C9A96E" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="24" cy="24" r="0.75" fill="#C9A96E" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Deep Forest & Emerald Background -->
  <rect width="600" height="600" fill="url(#bgForest)"/>
  <rect width="600" height="600" fill="url(#celestialGrid)"/>
  <circle cx="300" cy="270" r="230" fill="url(#emeraldAura)"/>
  <circle cx="300" cy="250" r="180" fill="url(#goldAura)"/>

  <!-- Delicate Gold Frame with Celestial Notches -->
  <rect x="22" y="22" width="556" height="556" fill="none" stroke="#C9A96E" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="8 6"/>
  <rect x="28" y="28" width="544" height="544" fill="none" stroke="#C9A96E" stroke-opacity="0.1" stroke-width="0.75"/>

  <!-- Four-Point Celestial Star Corner Motifs -->
