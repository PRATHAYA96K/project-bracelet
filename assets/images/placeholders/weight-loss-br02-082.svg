    <path d="M 0 -18 L 2 -4 L 16 0 L 2 4 L 0 18 L -2 4 L -16 0 L -2 -4 Z" fill="#C9A96E" fill-opacity="0.35"/>
  </g>

  <!-- Typography Block -->
  <text x="300" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" letter-spacing="3" fill="#C9A96E" text-transform="uppercase">Wellness &amp; Goals</text>
  <text x="300" y="432" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="25" font-weight="500" letter-spacing="1.5" fill="#FAF7F0">WEIGHT LOSS BRACELET</text>
