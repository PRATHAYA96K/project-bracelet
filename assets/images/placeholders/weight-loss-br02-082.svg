    <ellipse cx="0" cy="0" rx="135" ry="62" fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 3"/>
    <ellipse cx="0" cy="0" rx="150" ry="70" fill="none" stroke="#265C45" stroke-width="1" stroke-opacity="0.5"/>
    
    <!-- Intention Orbital Nodes (Natural Mineral Beads) -->
    <circle cx="-135" cy="0" r="9" fill="#9C3D28" stroke="#E6CB9B" stroke-width="1"/>
    <circle cx="-108" cy="-34" r="8" fill="#C9A96E" stroke="#FAF7F0" stroke-width="1"/>
    <circle cx="-58" cy="-56" r="9" fill="#2E6B52" stroke="#E6CB9B" stroke-width="1"/>
    <circle cx="0" cy="-62" r="10.5" fill="#D99B26" stroke="#FAF7F0" stroke-width="1.2"/>
    <circle cx="58" cy="-56" r="9" fill="#9C3D28" stroke="#E6CB9B" stroke-width="1"/>
    <circle cx="108" cy="-34" r="8" fill="#C9A96E" stroke="#FAF7F0" stroke-width="1"/>
    <circle cx="135" cy="0" r="9" fill="#2E6B52" stroke="#E6CB9B" stroke-width="1"/>
    <circle cx="108" cy="34" r="8" fill="#D99B26" stroke="#FAF7F0" stroke-width="1"/>
    <circle cx="58" cy="56" r="9" fill="#9C3D28" stroke="#E6CB9B" stroke-width="1"/>
    <circle cx="0" cy="62" r="10" fill="#2E6B52" stroke="#FAF7F0" stroke-width="1.2"/>
    <circle cx="-58" cy="56" r="9" fill="#C9A96E" stroke="#E6CB9B" stroke-width="1"/>
    <circle cx="-108" cy="34" r="8" fill="#9C3D28" stroke="#FAF7F0" stroke-width="1"/>

