    <path d="M 578 22 Q 578 29 585 29 Q 578 29 578 36 Q 578 29 571 29 Q 578 29 578 22" />
    <path d="M 22 578 Q 22 571 29 571 Q 22 571 22 564 Q 22 571 15 571 Q 22 571 22 578" />
    <path d="M 578 578 Q 578 571 585 571 Q 578 571 578 564 Q 578 571 571 571 Q 578 571 578 578" />
  </g>

  <!-- Product Code Tag -->
